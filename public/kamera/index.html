<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>clevia – Live-Kameraführung</title>
<style>
  :root { --gruen:#3a7d5c; --gruen-hell:#5fae83; --rot:#c0553f; --gelb:#d9a441; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#0d0f0e; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; color:#fff; overflow:hidden; }
  #buehne { position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; background:#000; }
  video { width:100%; height:100%; object-fit:cover; }
  /* Scan-Rahmen */
  #rahmen { position:absolute; inset:12% 8%; border:2px solid rgba(255,255,255,.35); border-radius:22px; pointer-events:none; transition:border-color .25s, box-shadow .25s; }
  #rahmen.gut { border-color:var(--gruen-hell); box-shadow:0 0 0 3px rgba(95,174,131,.3), 0 0 40px rgba(95,174,131,.35); }
  /* Ecken-Winkel für Kamera-Look */
  .ecke { position:absolute; width:26px; height:26px; border:3px solid var(--gruen-hell); opacity:.9; }
  .ecke.tl { top:-2px; left:-2px; border-right:0; border-bottom:0; border-radius:12px 0 0 0; }
  .ecke.tr { top:-2px; right:-2px; border-left:0; border-bottom:0; border-radius:0 12px 0 0; }
  .ecke.bl { bottom:-2px; left:-2px; border-right:0; border-top:0; border-radius:0 0 0 12px; }
  .ecke.br { bottom:-2px; right:-2px; border-left:0; border-top:0; border-radius:0 0 12px 0; }
  /* Feedback-Pille oben */
  #feedback { position:absolute; top:6%; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.62); backdrop-filter:blur(10px); padding:12px 22px; border-radius:100px; font-size:16px; font-weight:600; letter-spacing:.2px; display:flex; align-items:center; gap:9px; transition:background .25s; white-space:nowrap; }
  #feedback.gut { background:rgba(58,125,92,.85); }
  #feedback .punkt { width:9px; height:9px; border-radius:50%; background:var(--gelb); transition:background .25s; }
  #feedback.gut .punkt { background:#fff; }
  /* Fortschrittsring um den Auslöser */
  #ausloeser-wrap { position:absolute; bottom:7%; left:50%; transform:translateX(-50%); width:82px; height:82px; }
  #ring { position:absolute; inset:0; transform:rotate(-90deg); }
  #ring circle { fill:none; stroke-width:5; }
  #ring .bg { stroke:rgba(255,255,255,.22); }
  #ring .fg { stroke:var(--gruen-hell); stroke-linecap:round; transition:stroke-dashoffset .12s linear; }
  #ausloeser { position:absolute; inset:9px; border-radius:50%; background:#fff; border:0; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  #ausloeser:active { transform:scale(.94); }
  #ausloeser::after { content:''; width:56px; height:56px; border-radius:50%; border:3px solid #0d0f0e; }
  /* Messwerte (dezent unten, zum Verständnis/Debug) */
  #werte { position:absolute; bottom:2%; left:50%; transform:translateX(-50%); font-size:11px; color:rgba(255,255,255,.5); font-variant-numeric:tabular-nums; letter-spacing:.3px; }
  /* Start/Fehler-Overlay */
  #overlay { position:absolute; inset:0; background:linear-gradient(160deg,#12352a,#0d1f18); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:32px; gap:18px; z-index:5; }
  #overlay h1 { font-size:24px; font-weight:700; }
  #overlay p { font-size:15px; color:rgba(255,255,255,.75); line-height:1.5; max-width:300px; }
  #overlay button { margin-top:8px; background:var(--gruen); color:#fff; border:0; padding:15px 34px; border-radius:100px; font-size:16px; font-weight:600; cursor:pointer; }
  #overlay button:active { transform:scale(.97); }
  .weg { display:none !important; }
  /* Ergebnis-Blitz */
  #blitz { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:4; }
  #blitz.an { animation:flash .5s ease; }
  @keyframes flash { 0%{opacity:.9;} 100%{opacity:0;} }
  #shot { position:absolute; inset:0; background:#000 center/contain no-repeat; z-index:6; display:flex; flex-direction:column; }
  #shot img { width:100%; height:100%; object-fit:contain; }
  #shot .leiste { position:absolute; bottom:0; left:0; right:0; padding:22px; display:flex; gap:12px; background:linear-gradient(transparent,rgba(0,0,0,.7)); }
  #shot button { flex:1; padding:15px; border-radius:14px; border:0; font-size:15px; font-weight:600; }
  #wiederholen { background:rgba(255,255,255,.2); color:#fff; }
  #nutzen { background:var(--gruen-hell); color:#06231a; }
</style>
</head>
<body>
<div id="buehne">
  <video id="video" playsinline muted></video>
  <div id="rahmen">
    <span class="ecke tl"></span><span class="ecke tr"></span>
    <span class="ecke bl"></span><span class="ecke br"></span>
  </div>
  <div id="feedback"><span class="punkt"></span><span id="fb-text">Kamera startet…</span></div>
  <div id="ausloeser-wrap">
    <svg id="ring" viewBox="0 0 82 82">
      <circle class="bg" cx="41" cy="41" r="37"></circle>
      <circle class="fg" cx="41" cy="41" r="37" stroke-dasharray="232.5" stroke-dashoffset="232.5"></circle>
    </svg>
    <button id="ausloeser" aria-label="Auslösen"></button>
  </div>
  <div id="werte">–</div>
  <div id="blitz"></div>

  <div id="overlay">
    <h1>clevia Scanner</h1>
    <p>Halte ein Produkt-Etikett vor die Kamera. Die App führt dich zum perfekten Scan und löst automatisch aus, sobald das Bild scharf und gut lesbar ist.</p>
    <button id="start">Kamera starten</button>
  </div>

  <div id="shot" class="weg">
    <img id="shot-img" alt="Aufnahme">
    <div class="leiste">
      <button id="wiederholen">Nochmal</button>
      <button id="nutzen">Verwenden</button>
    </div>
  </div>
</div>

<script src="clevia-kamera.js"></script>
<script>
  const $ = s => document.querySelector(s);
  const ringFg = $('#ring .fg');
  const RING_UMFANG = 2 * Math.PI * 37; // = 232.5
  ringFg.setAttribute('stroke-dasharray', RING_UMFANG.toFixed(1));

  let kamera = null;

  function setFortschritt(p) {
    ringFg.setAttribute('stroke-dashoffset', (RING_UMFANG * (1 - p)).toFixed(1));
  }

  function zeigeAufnahme(bild) {
    $('#blitz').classList.add('an');
    setTimeout(() => $('#blitz').classList.remove('an'), 500);
    $('#shot-img').src = bild;
    $('#shot').classList.remove('weg');
  }

  async function starten() {
    $('#overlay').classList.add('weg');
    kamera = new KameraFuehrung({
      autoAusloeser: true,
      autoAusloeserFrames: 8,
    });

    kamera.on('feedback', u => {
      const fb = $('#feedback'), rahmen = $('#rahmen');
      $('#fb-text').textContent = u.feedback;
      fb.classList.toggle('gut', u.gut);
      rahmen.classList.toggle('gut', u.gut);
      setFortschritt(kamera.fortschritt);
      const d = u.details;
      $('#werte').textContent = `Schärfe ${d.schaerfe}  ·  Licht ${d.helligkeit}  ·  Füllung ${d.fuellung}`;
    });

    kamera.on('ausgeloest', ({ bild }) => {
      kamera.stop();
      setFortschritt(0);
      zeigeAufnahme(bild);
    });

    kamera.on('fehler', e => {
      $('#overlay').classList.remove('weg');
      $('#overlay h1').textContent = 'Kein Kamerazugriff';
      $('#overlay p').textContent = e.code === 'kein_zugriff'
        ? 'Bitte erlaube den Kamerazugriff in deinem Browser und lade die Seite neu. Auf iPhone: Safari-Einstellungen → Kamera.'
        : ('Fehler: ' + e.message);
      $('#start').textContent = 'Erneut versuchen';
    });

    const ok = await kamera.start($('#video'));
    if (ok) $('#fb-text').textContent = 'Etikett anvisieren…';
  }

  $('#start').addEventListener('click', starten);
  // Manueller Auslöser (falls jemand nicht auf Auto warten will)
  $('#ausloeser').addEventListener('click', () => { if (kamera) kamera.ausloesen(); });
  // "Nochmal" → Kamera neu starten
  $('#wiederholen').addEventListener('click', () => {
    $('#shot').classList.add('weg');
    starten();
  });
  // "Verwenden" → hier würde das Bild an den Scanner gehen
  $('#nutzen').addEventListener('click', () => {
    alert('In der App geht dieses Bild jetzt an den Multi-Signal-Konsens-Scanner.');
    $('#shot').classList.add('weg');
    starten();
  });
</script>
</body>
</html>
